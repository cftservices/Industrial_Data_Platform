# Vla Batch v2 demo — scenario overlay (fabriek-als-OPC-UA -> MonsterMQ=UNS -> historian + MES)
#
# v2-architectuur (zie README.md + factory-model/isa95-vla.json):
#
#   vla-factory (asyncua OPC-UA server + batch-physics, "black box met SCADA-knoppen")
#      |  opc.tcp://vla-factory:4840/DairyWorks  (ns=2)
#      v  MonsterMQ ingest de fabriek NATIVE via zijn OPC-UA-client
#         (addOpcUaDevice, geregistreerd door de one-shot vla-opcua-init container).
#      v
#   monstermq (MQTT broker = data layer / UNS-bus)  --archive group dw_uns_archive--> mongo (idp.dw_uns_archive)
#      |
#      +-> vla-tdengine-bridge (reuse tdengine-poc/bridge.py) -> vla-tdengine (historian)
#      +-> vla-batch-engine (FastAPI MES-laag, REST + report) <-> mongo (domein-collections)
#      |     control-pad: batch-engine commandeert de factory DIRECT via OPC-UA methods
#      +-> grafana (leest vla-tdengine)  +  vla-dashboard (leest vla-batch-engine REST)
#
# vla-connector = OPTIONELE FALLBACK (profile "fallback") als MonsterMQ's OPC-UA-
# client config-quirks geeft (bv. ns-index-afwijking). Draait NIET default.
#
# Run (from idp-os root) — ALTIJD samen met de slim-base:
#   docker compose -f docker-compose.slim.yml \
#                  -f scenarios/vla-batch/docker-compose.vla.yml up -d --build
#
# Fallback (native OPC-UA-client faalt) — start de connector erbij:
#   docker compose -f docker-compose.slim.yml \
#                  -f scenarios/vla-batch/docker-compose.vla.yml --profile fallback up -d vla-connector
#
# Requires a .env (see scenarios/vla-batch/.env.example).
# Only vla-dashboard + grafana (uit slim-base) zijn web-facing via Traefik; de
# rest (factory / init / batch-engine / tdengine / bridge) blijft intern.

volumes:
  vla-tdengine-data:
  vla-tdengine-log:
  vla-ollama-data:
  vla-sql-data:

services:

  # ── VLA FACTORY (asyncua OPC-UA server + batch-physics) ──────────────────
  # Draait de ISA-88 batch-FSM + physics en exposeert alles als OPC-UA nodes
  # (ns=2) + methods. GEEN publieke poort — intern bereikbaar op
  # opc.tcp://vla-factory:4840/DairyWorks voor MonsterMQ's OPC-UA-client (native
  # ingest) en voor de batch-engine (method-calls / control-pad).
  vla-factory:
    build:
      context: ./scenarios/vla-batch/factory
      dockerfile: Dockerfile
    image: techflow/vla-factory:latest
    container_name: vla-factory
    restart: unless-stopped
    environment:
      OPCUA_ENDPOINT: "opc.tcp://0.0.0.0:4840/DairyWorks"
      FACTORY_MODEL: /model/isa95-vla.json
      # ── demo-tempo ────────────────────────────────────────────────────────
      # Elke processtap duurt hiermee ~30s, een hele batch ~120s (was ~86s met
      # een scheve verdeling: doseren 2.4s tegenover koken 60s).
      # hold_sec blijft bewust 300 PROCES-seconden (viscositeitsformule +
      # sample-spec + EBR-contract); we vertragen via TIME_SCALE.
      # Rates zijn afgeleid als: hoeveelheid / (30s * TIME_SCALE).
      # Aanpassen kost alleen `up -d vla-factory`, geen rebuild.
      TIME_SCALE: "15.0"          # proces-seconden per echte seconde (was 6.0)
      DOSE_RATE_KG_S: "13.0"      # 5850 kg / 450 proces-s -> 30.0s
      HEAT_RATE_C_S: "0.47"       # 71 C / 150 proces-s -> 10s opwarmen + 20s hold
      COOL_RATE_C_S: "0.145"      # 65.5 C / 450 proces-s -> 30.2s
      FILL_RATE_PACKS_S: "11.2"   # 5000 packs / 450 proces-s -> 30.0s
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    mem_limit: 256m
    networks:
      - idp-network

  # ── VLA OPC-UA INIT (★ PRIMARY ingest path) ──────────────────────────────
  # One-shot: registers vla-factory as an OPC-UA device in MonsterMQ via GraphQL
  # (addOpcUaDevice). After this runs, MonsterMQ's OWN OPC-UA client ingests the
  # factory natively and republishes onto DairyWorks/Vla/#. Config persists in
  # Mongo, so this exits 0 and is not restarted.
  vla-opcua-init:
    image: curlimages/curl:latest
    container_name: vla-opcua-init
    restart: "no"
    volumes:
      - ./scenarios/vla-batch/monstermq-init:/init:ro
    entrypoint: ["sh", "/init/init-vla-opcua.sh"]
    depends_on:
      monstermq:
        condition: service_healthy
      vla-factory:
        condition: service_started
    networks:
      - idp-network

  # ── VENDOR ISLAND: OPC-DA (profile "vendor") ─────────────────────────────
  # The legacy skids, reached the way you reach them in real life: a DA server
  # behind a DA/UA tunneller. We connect to the tunneller's UA endpoint.
  #
  # ⚠ We do NOT implement DCOM. OPC-DA is Windows-only and cannot run in a Linux
  #   container. The TRANSPORT here is UA; the DATA is DA, and that is what
  #   carries the lesson: flat ItemIDs (Ch1.Dev2.TT_3003_PV), the DA quality
  #   word as a companion item (192/64/0) instead of a UA StatusCode, no source
  #   timestamp, and scaled integers. Say this out loud in the demo.
  #
  # This container is a silo on purpose: it talks OPC-UA to vla-factory (because
  # the skid is physically in the same pipe) and to NOTHING else. Stop MonsterMQ
  # and it keeps running, still measuring, still invisible. The machines do not
  # need the data layer; the business does.
  vla-vendor-opcda:
    profiles: ["vendor"]
    build:
      context: ./scenarios/vla-batch/vendor-sim
      dockerfile: Dockerfile
    image: techflow/vla-vendor-sim:latest
    container_name: vla-vendor-opcda
    restart: unless-stopped
    environment:
      ISLAND: opcda
      ENDPOINT: "opc.tcp://0.0.0.0:4843/DATunnel"
      OPCUA_ENDPOINT: "opc.tcp://vla-factory:4840/DairyWorks"
      SOURCE_SYSTEMS: /model/source-systems.json
      SCAN_INTERVAL: "1.0"
      # keep in step with TIME_SCALE on vla-factory: instrument time constants
      # in source-systems.json are quoted in PROCESS seconds, not real seconds
      TIME_SCALE: "15.0"
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    depends_on:
      vla-factory:
        condition: service_started
    mem_limit: 160m
    networks:
      - idp-network

  # One-shot: registers the DA island as a MonsterMQ OPC-UA device so raw vendor
  # items land on raw/vla/#. Script is GENERATED by tools/gen-connect.py.
  vla-vendor-da-init:
    profiles: ["vendor"]
    image: curlimages/curl:latest
    container_name: vla-vendor-da-init
    restart: "no"
    volumes:
      - ./scenarios/vla-batch/monstermq-init:/init:ro
    entrypoint: ["sh", "/init/init-vendor-da.sh"]
    depends_on:
      monstermq:
        condition: service_healthy
      vla-vendor-opcda:
        condition: service_started
    networks:
      - idp-network

  # ── VENDOR ISLAND: OPC-UA (profile "vendor") ─────────────────────────────
  # The MODERN vendor skids, and the sharpest argument in the demo. Real source
  # timestamps, real StatusCodes, real doubles, subscriptions: everything a
  # vendor datasheet promises under "Industry 4.0 ready", all genuinely present.
  #
  # And PT_1101_PV on ns=2 of urn:vendorline still means nothing to any consumer.
  # The DA island next door is worse in every technical respect, and after the
  # Model step the two are equally useful. Protocol quality was never the gap.
  vla-vendor-opcua:
    profiles: ["vendor"]
    build:
      context: ./scenarios/vla-batch/vendor-sim
      dockerfile: Dockerfile
    image: techflow/vla-vendor-sim:latest
    container_name: vla-vendor-opcua
    restart: unless-stopped
    environment:
      ISLAND: opcua
      ENDPOINT: "opc.tcp://0.0.0.0:4842/VendorLine"
      OPCUA_ENDPOINT: "opc.tcp://vla-factory:4840/DairyWorks"
      SOURCE_SYSTEMS: /model/source-systems.json
      SCAN_INTERVAL: "1.0"
      TIME_SCALE: "15.0"
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    depends_on:
      vla-factory:
        condition: service_started
    mem_limit: 160m
    networks:
      - idp-network

  vla-vendor-ua-init:
    profiles: ["vendor"]
    image: curlimages/curl:latest
    container_name: vla-vendor-ua-init
    restart: "no"
    volumes:
      - ./scenarios/vla-batch/monstermq-init:/init:ro
    entrypoint: ["sh", "/init/init-vendor-ua.sh"]
    depends_on:
      monstermq:
        condition: service_healthy
      vla-vendor-opcua:
        condition: service_started
    networks:
      - idp-network

  # ── VENDOR ISLAND: SQL SERVER (profile "vendor-sql") ─────────────────────
  # The IT systems: lab, maintenance, energy. They matter most precisely because
  # there is no protocol gap to blame. The data sits in a database, in a modern
  # format, with a perfectly good query interface, and it is still invisible to
  # the plant because nobody joined it.
  #
  # Behind its OWN profile on top of "vendor" because it is the heaviest thing in
  # the stack. Azure SQL Edge is the default (same engine, same TDS, ~700 MB);
  # mcr.microsoft.com/mssql/server:2022 needs a documented 2 GB minimum and is
  # the swap for a bigger box. Note SQL Edge is deprecated by Microsoft: fine as
  # a demo stand-in, but it should be a known fact rather than a discovery.
  vla-vendor-sql:
    profiles: ["vendor-sql"]
    image: mcr.microsoft.com/azure-sql-edge:latest
    # image: mcr.microsoft.com/mssql/server:2022-latest   # needs mem_limit 2g
    container_name: vla-vendor-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${SQL_PASS:-Vla-Demo-Passw0rd}
      MSSQL_PID: Developer
    volumes:
      - vla-sql-data:/var/opt/mssql
    mem_limit: 1g
    networks:
      - idp-network

  # Polls the SQL islands and publishes onto the SAME raw root as every other
  # island, so Condition and Model never learn which protocol a reading came in
  # on. Adding a protocol must not mean touching the model.
  # sources.yaml is GENERATED by tools/gen-connect.py.
  vla-vendor-gateway:
    profiles: ["vendor-sql"]
    build:
      context: ./scenarios/vla-batch/vendor-gateway
      dockerfile: Dockerfile
    image: techflow/vla-vendor-gateway:latest
    container_name: vla-vendor-gateway
    restart: unless-stopped
    environment:
      SOURCES: /app/sources.yaml
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
      SQL_USER: sa
      SQL_PASS: ${SQL_PASS:-Vla-Demo-Passw0rd}
    depends_on:
      monstermq:
        condition: service_healthy
      vla-vendor-sql:
        condition: service_started
    mem_limit: 128m
    networks:
      - idp-network

  # ── VLA CONDITIONER (profile "vendor") — steps 2 and 3 of the seven ──────
  #   raw/vla/{system}/{native}  --Condition--> --Model-->  DairyWorks/Vla/#
  #
  # Owned service rather than broker config on purpose: MonsterMQ's flow engine
  # keeps its rules in Mongo, so the transformation logic would not be in git.
  # That breaks version control, the first DataOps-for-OT discipline, and cannot
  # be tested offline. NiFi wants ~1.5 GB of heap. Node-RED is banned.
  #
  # DEMO SWITCH:
  #   curl -XPOST http://vla-conditioner:8080/api/v1/model-layer -d '{"enabled":false}'
  # Raw keeps flowing, the UNS goes quiet, Grafana and the UI drain. Turn it back
  # on and everything returns. Ten seconds, and the whole argument.
  vla-conditioner:
    profiles: ["vendor"]
    build:
      context: ./scenarios/vla-batch/conditioner
      dockerfile: Dockerfile
    image: techflow/vla-conditioner:latest
    container_name: vla-conditioner
    restart: unless-stopped
    environment:
      MODEL_DIR: /model
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
      RAW_ROOT: raw/vla
      HTTP_PORT: "8080"
      CONDITION_TRACE: "off"
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    depends_on:
      monstermq:
        condition: service_healthy
    mem_limit: 192m
    networks:
      - idp-network

  # ── VLA CONNECTOR (OPTIONAL FALLBACK — profile "fallback") ───────────────
  # NOT part of the default stack. Only runs with:  --profile fallback
  # Use it if MonsterMQ's native OPC-UA client hits config quirks (e.g. an
  # ns-index mismatch on the factory). Same job: OPC-UA client <-> MQTT.
  #   Status:  reads vla-factory OPC-UA nodes -> publishes on the UNS.
  #   Command: subscribes DairyWorks/Vla/.../Command/# -> writes/calls methods.
  # ⚠ Do NOT run this together with a registered/enabled vla OPC-UA device
  #   (double-publish). Pick one: native (default) OR connector (--profile
  #   fallback + toggleOpcUaDevice(name:"vla",enabled:false)).
  vla-connector:
    profiles: ["fallback"]
    build:
      context: ./scenarios/vla-batch/connector
      dockerfile: Dockerfile
    image: techflow/vla-connector:latest
    container_name: vla-connector
    restart: unless-stopped
    environment:
      OPCUA_ENDPOINT: "opc.tcp://vla-factory:4840/DairyWorks"
      FACTORY_MODEL: /model/isa95-vla.json
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    mem_limit: 256m
    depends_on:
      vla-factory:
        condition: service_started
      monstermq:
        condition: service_healthy
    networks:
      - idp-network

  # ── VLA BATCH ENGINE (FastAPI MES-laag: orders/batches/samples/report) ────
  # REST op poort 8000 (intern; nginx-dashboard proxiet /api -> hier).
  # Offline-first: draait ook zonder Mongo/MQTT.
  vla-batch-engine:
    build:
      context: ./scenarios/vla-batch/batch-engine
      dockerfile: Dockerfile
    image: techflow/vla-batch-engine:latest
    container_name: vla-batch-engine
    restart: unless-stopped
    environment:
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
      MONGO_URL: ${MONGO_URL}
      MONGO_DB: ${MONGO_DB}
      FACTORY_MODEL: /model/isa95-vla.json
    volumes:
      - ./scenarios/vla-batch/factory-model:/model:ro
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_started
      monstermq:
        condition: service_healthy
    networks:
      - idp-network

  # ── VLA TDENGINE (historian, TSDB-OSS) ───────────────────────────────────
  # taosd + taosAdapter in 1 image. FQDN MOET matchen met de container-naam.
  # Geen publieke poort — Grafana leest via de interne datasource.
  vla-tdengine:
    image: tdengine/tdengine:latest
    container_name: vla-tdengine
    hostname: vla-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: vla-tdengine
      TZ: Europe/Amsterdam
    volumes:
      - vla-tdengine-data:/var/lib/taos
      - vla-tdengine-log:/var/log/taos
    mem_limit: 640m
    networks:
      - idp-network
    healthcheck:
      # Wachtwoord-loze probe: taosAdapter REST-poort open? (`taos -s` zou de
      # root-creds nodig hebben — die zijn niet default meer.) /bin/sh is dash
      # (geen /dev/tcp), dus expliciet bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6041"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── VLA TDGPT ANODE (open-source AI-laag: forecasting + anomaly-detection) ──
  # taosanode (TDgpt) als losse analyse-node. De SLIM image (1.9 GB, geen zware
  # deep-learning modellen) levert de statistische algoritmes (IQR, k-sigma,
  # Grubbs, LOF) die ANOMALY_WINDOW gebruikt. taosd roept deze node aan; hij is
  # zelf stateless compute. Geen publieke poort — intern op idp-network :6090.
  # Registreren vanuit taosd:  CREATE ANODE 'vla-tdgpt:6090';
  #   ⚠ deze image bindt op 6090 (niet de 6035 uit sommige docs — geverifieerd).
  # Bewijst het canon-punt: de "AI agent" is open source (AGPL), géén Enterprise
  # taosX/IDMP nodig — draait op dezelfde €8 VPS.
  vla-tdgpt:
    image: tdengine/tdengine-tdgpt:3.3.6.0
    container_name: vla-tdgpt
    hostname: vla-tdgpt
    # Profile "ai": tdgpt (1500m) + ollama (4g) + vla-ai (256m) is ~5.8 GB, which
    # is far more than the whole rest of the stack. They used to start by default,
    # which quietly made the "~2 GB VPS" claim in DEPLOY.md untrue for anyone who
    # ran plain `docker compose up`. Opt in with --profile ai.
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
    mem_limit: 1500m
    networks:
      - idp-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6090"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── VLA OLLAMA (lokale LLM — "Praat met je fabriek", geen externe API) ──────
  # Draait een klein open-source model op de VPS zelf. Geen publieke poort; geen
  # data naar buiten. Model wordt na start gepulld (zie deploy.sh / handmatig:
  # docker exec vla-ollama ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}).
  vla-ollama:
    image: ollama/ollama:latest
    container_name: vla-ollama
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - vla-ollama-data:/root/.ollama
    mem_limit: 4g
    networks:
      - idp-network

  # ── VLA AI (NL->SQL FastAPI: natuurlijke taal -> TDengine, read-only) ───────
  # De open-source tegenhanger van IDMP's "AI Chat". Vraag in gewone taal ->
  # lokaal Ollama-model genereert SQL -> read-only op TDengine -> antwoord.
  vla-ai:
    build:
      context: ./scenarios/vla-batch/ai-nl2sql
      dockerfile: Dockerfile
    image: techflow/vla-ai:latest
    container_name: vla-ai
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_URL: "http://vla-ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      TD_URL: "http://vla-tdengine:6041"
      TD_DB: ${TD_DB:-idp}
      TD_USER: ${TD_USER:-root}
      TD_PASS: ${TD_PASS:-taosdata}
      PHRASE: "1"
    depends_on:
      vla-tdengine:
        condition: service_healthy
      vla-ollama:
        condition: service_started
    mem_limit: 256m
    networks:
      - idp-network

  # ── VLA TDENGINE BRIDGE (MonsterMQ -> TDengine, reuse tdengine-poc/bridge.py) ─
  # Herbruikt de bestaande bridge ONgewijzigd; alleen env aangepast op de
  # vla-UNS-topics + de vla-tdengine host.
  vla-tdengine-bridge:
    build:
      context: ./tdengine-poc
      dockerfile: Dockerfile
    image: techflow/vla-tdengine-bridge:latest
    container_name: vla-tdengine-bridge
    restart: unless-stopped
    environment:
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
      MQTT_TOPICS: "DairyWorks/Vla/#"
      TD_URL: "http://vla-tdengine:6041"
      TD_DB: ${TD_DB:-idp}
      TD_USER: ${TD_USER:-root}
      TD_PASS: ${TD_PASS:-taosdata}
      FLUSH_SECONDS: "1.0"
      FLUSH_LINES: "200"
    depends_on:
      vla-tdengine:
        condition: service_healthy
      monstermq:
        condition: service_healthy
    networks:
      - idp-network

  # ── VLA DASHBOARD (sales + admin SPA; nginx serveert ./dashboard, proxy /api) ─
  # Enige web-facing service uit deze overlay (naast grafana uit de slim-base).
  vla-dashboard:
    image: nginx:alpine
    container_name: vla-dashboard
    restart: unless-stopped
    volumes:
      - ./scenarios/vla-batch/dashboard:/usr/share/nginx/html:ro
      - ./scenarios/vla-batch/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vla-batch-engine
    networks:
      - idp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.milkdemo.rule=Host(`milkdemo.${DOMAIN}`)"
      - "traefik.http.routers.milkdemo.entrypoints=websecure"
      - "traefik.http.routers.milkdemo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.milkdemo.middlewares=milkdemo-auth@docker"
      # ⚠ De DEFINITIE van milkdemo-auth staat sinds 01-08 bij grafana, niet
      # hier. Traefik leest labels alleen van containers met traefik.enable=true,
      # dus stond de definitie op deze service, dan viel grafana om zodra
      # vla-dashboard verdween. Grafana overleeft elke dashboardwissel.
      - "traefik.http.services.milkdemo.loadbalancer.server.port=80"

  # ── VLA UI (Next.js 15) — vervangt vla-dashboard na de cutover ────────────
  # Draait BEWUST naast de oude SPA op een tweede hostname, zodat de demo blijft
  # werken tijdens de bouw. Omschakelen is straks een regelwijziging: de
  # milkdemo-router naar deze service laten wijzen en vla-dashboard schrappen.
  # Rollback is dan een git revert plus `docker compose up -d`.
  vla-ui:
    build:
      context: ./scenarios/vla-batch/ui
    container_name: vla-ui
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # De BFF praat intern met de engine; die is niet extern bereikbaar en
      # draagt geen eigen auth. Deze proxy is de enige weg naartoe, achter
      # dezelfde Traefik-basicauth als de rest.
      ENGINE_URL: http://vla-batch-engine:8000
      FACTORY_MODEL: /model/isa95-vla.json
      NEXT_PUBLIC_GRAFANA_PATH: /grafana/d/vla-line?kiosk
    volumes:
      # Dezelfde read-only mount als de engine: de UI serveert een whitelisted
      # projectie (drempels, specbanden), nooit het hele model.
      - ./scenarios/vla-batch/factory-model:/model:ro
    depends_on:
      - vla-batch-engine
    networks:
      - idp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vlaui.rule=Host(`milkdemo-next.${DOMAIN}`)"
      - "traefik.http.routers.vlaui.entrypoints=websecure"
      - "traefik.http.routers.vlaui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vlaui.middlewares=milkdemo-auth@docker"
      - "traefik.http.services.vlaui.loadbalancer.server.port=3000"

  # ── GRAFANA (uit slim-base) — mount de vla-provisioning ───────────────────
  # De grafana-service is al gedefinieerd in docker-compose.slim.yml (web-facing
  # via Traefik op grafana.${DOMAIN}). Deze override VERVANGT de provisioning-
  # mounts door de vla-provisioning (TDengine-datasource -> vla-tdengine + 1
  # vla-dashboard json), zodat Grafana ze op de standaard-paden inleest
  # (/etc/grafana/provisioning/{datasources,dashboards}). Grafana leest de
  # historian uit vla-tdengine via de tdengine-datasource-plugin.
  #
  # NB: docker-compose merge't volumes NIET per-item weg; deze lijst herhaalt
  # daarom bewust ook grafana-data zodat de eerdere slim-base-mounts naar
  # /etc/grafana/provisioning worden overschreven door de vla-versie.
  grafana:
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scenarios/vla-batch/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scenarios/vla-batch/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_INSTALL_PLUGINS: marcusolsson-json-datasource,tdengine-datasource
      # doorgegeven aan de TDengine-datasource provisioning (${TD_PASS}).
      TD_PASS: ${TD_PASS:-taosdata}
      # base64("root:<TD_PASS>") — de plugin-proxyroutes (het pad dat de BROWSER
      # gebruikt) bouwen hun Authorization-header uit secureJsonData.basicAuth,
      # niet uit Grafana's eigen basicAuth. Zonder dit tonen alle panels
      # "No data" terwijl de health-check groen blijft. Zet hem in .env:
      #   TD_BASIC_AUTH=$(printf 'root:%s' "$TD_PASS" | base64 -w0)
      TD_BASIC_AUTH: ${TD_BASIC_AUTH:-cm9vdDp0YW9zZGF0YQ==}
      # ── same-origin embedding (scherm 5) ────────────────────────────────
      # Zonder allow_embedding stuurt Grafana X-Frame-Options: deny en blijft
      # elk iframe leeg met een console-fout. Onder een subpad van dezelfde
      # host is het iframe same-origin, dus de basicauth reist mee en er is
      # geen third-party-cookie nodig.
      #
      # Combineer serve_from_sub_path NIET met een prefix-strip in de proxy:
      # die twee doen hetzelfde werk dubbel en geven redirect-loops of 404's op
      # statische assets. Traefik geeft /grafana hier intact door.
      GF_SERVER_ROOT_URL: https://milkdemo.${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Blijft expliciet uit; zie de waarschuwing bij de labels.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    # ── auth ──────────────────────────────────────────────────────────────
    # De slim-base zet vier Traefik-labels voor grafana.${DOMAIN} ZONDER
    # middleware, terwijl vla-dashboard wel achter milkdemo-auth zit. Grafana's
    # eigen login was dan de enige barrière voor de volledige historian. Deze
    # override zet dezelfde basicauth ervoor, zodat beide web-facing services
    # dezelfde voordeur hebben.
    #
    # ⚠ Zet GF_AUTH_ANONYMOUS_ENABLED NIET aan zolang deze middleware er niet
    # is: dan is de historian publiek zonder enige login. Moet embedding later
    # wel, dan is de juiste vorm Grafana onder dezelfde hostname op een
    # path-prefix (GF_SERVER_ROOT_URL=https://milkdemo.${DOMAIN}/grafana/ +
    # GF_SERVER_SERVE_FROM_SUB_PATH=true + GF_SECURITY_ALLOW_EMBEDDING=true,
    # router Host(milkdemo) && PathPrefix(/grafana) mét milkdemo-auth, en deze
    # losse grafana-router weg). Eén credential, same-origin.
    labels:
      - "traefik.enable=true"
      # ── DEFINITIE van de middleware staat vanaf 01-08 HIER ────────────────
      # Grafana overleeft een dashboardwissel, vla-dashboard niet. Stond de
      # definitie daar, dan viel deze router om zodra die service verdween.
      - "traefik.http.middlewares.milkdemo-auth.basicauth.users=${DASHBOARD_AUTH}"
      # ── losse hostname (blijft tijdens de parallelfase) ───────────────────
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=milkdemo-auth@docker"
      # ── same-origin embed-route: /grafana op de demo-hostname ─────────────
      # Hiermee wordt PR-14's "een beveiligde URL" letterlijk waar: het iframe
      # in scherm 5 is same-origin, dus de basicauth reist gewoon mee en het
      # hele cross-site-cookieprobleem (SameSite=None, Safari ITP, Firefox
      # Total Cookie Protection) verdwijnt.
      #
      # ⚠ GF_AUTH_ANONYMOUS_ENABLED blijft UIT. Aanzetten zou de complete
      # historian publiek queryable maken: een anonieme bezoeker is Viewer, en
      # een Viewer mag via de HTTP-API willekeurige queries naar elke datasource
      # sturen.
      - "traefik.http.routers.grafana-embed.rule=Host(`milkdemo.${DOMAIN}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana-embed.entrypoints=websecure"
      - "traefik.http.routers.grafana-embed.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana-embed.middlewares=milkdemo-auth@docker"
      - "traefik.http.routers.grafana-embed.priority=100"
      - "traefik.http.routers.grafana-embed.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      vla-tdengine:
        condition: service_healthy
