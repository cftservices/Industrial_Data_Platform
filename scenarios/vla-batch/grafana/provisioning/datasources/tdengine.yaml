apiVersion: 1

# Datasources for the Vla Batch demo.
#
# Both plugins are installed by the grafana override in docker-compose.vla.yml:
#   GF_INSTALL_PLUGINS=marcusolsson-json-datasource,tdengine-datasource
datasources:

  # ---------------------------------------------------------------- historian
  # TDengine (vla-tdengine, OSS) — everything the bridge wrote from MQTT
  # DairyWorks/Vla/# into idp.telemetry. taosAdapter REST on :6041.
  #
  # ⚠ WHY basicAuth AND NOT jsonData.user + secureJsonData.password:
  # plugin 3.x uses Grafana's standard HTTP settings. Its health check runs
  # `select server_version()` against ${url}/rest/sql using Grafana's own
  # basic-auth header. With jsonData.user/secureJsonData.password no
  # Authorization header is sent at all, and taosAdapter answers
  # 401 Unauthorized — which is exactly what /api/datasources/<id>/health
  # reported. The credentials were never wrong, the keys were.
  - name: TDengine
    type: tdengine-datasource
    uid: vla-tdengine            # LOCK — dashboards reference this uid
    orgId: 1
    access: proxy
    url: http://vla-tdengine:6041
    isDefault: true
    basicAuth: true
    basicAuthUser: root
    secureJsonData:
      # env interpolation; real value comes from .env TD_PASS (not in git)
      basicAuthPassword: ${TD_PASS}
    jsonData:
      # duplicate of `url` above: older plugin builds read the query URL here.
      url: http://vla-tdengine:6041
    editable: true

  # ---------------------------------------------------------------------- MES
  # batch-engine REST — orders, OEE, verdicts, inventory, equipment health.
  # None of that lives in the historian; it is MongoDB behind the FastAPI.
  # Reachable because grafana and vla-batch-engine share idp-network, and the
  # engine REST is internal-only so it carries no auth of its own.
  - name: Batch Engine
    type: marcusolsson-json-datasource
    uid: vla-batch-engine        # LOCK — dashboards reference this uid
    orgId: 1
    access: proxy
    url: http://vla-batch-engine:8000/api/v1
    isDefault: false
    editable: true
