apiVersion: 1

# Datasources for the Vla Batch demo.
#
# Both plugins are installed by the grafana override in docker-compose.vla.yml:
#   GF_INSTALL_PLUGINS=marcusolsson-json-datasource,tdengine-datasource
datasources:

  # ---------------------------------------------------------------- historian
  # TDengine (vla-tdengine, OSS) — everything the bridge wrote from MQTT
  # DairyWorks/Vla/# into idp.telemetry. taosAdapter REST on :6041.
  #
  # ⚠ THIS DATASOURCE NEEDS ITS CREDENTIALS IN THREE PLACES. That is not
  # redundancy, the plugin has two independent code paths:
  #
  #  1. BACKEND — /api/ds/query, used by alerting and by the HTTP API.
  #     Reads jsonData.url and Grafana's own basicAuth/basicAuthUser +
  #     secureJsonData.basicAuthPassword. This is also what the health check
  #     uses, so a green health button proves only half the wiring.
  #
  #  2. FRONTEND — /api/datasources/proxy/uid/<uid>/sql, used by every panel
  #     in the browser. Grafana resolves that against the plugin's own routes
  #     in plugin.json, which are templated as:
  #         url:    {{ .SecureJsonData.url }}/rest/sql
  #         header: Basic {{ .SecureJsonData.basicAuth }}
  #     So the frontend reads the URL and the credential out of secureJsonData,
  #     and secureJsonData.basicAuth must be the BASE64 of "user:password",
  #     not the plain password.
  #
  # Leave out the secureJsonData pair and every panel shows "No data" while the
  # health check stays green and /api/ds/query keeps working. The proxy fails
  # with `unsupported protocol scheme ""` (empty URL) and returns 502.
  #
  # Earlier this file used jsonData.user + secureJsonData.password, which is
  # neither path: no Authorization header at all, so taosAdapter answered 401.
  - name: TDengine
    type: tdengine-datasource
    uid: vla-tdengine            # LOCK — dashboards reference this uid
    orgId: 1
    access: proxy
    url: http://vla-tdengine:6041
    isDefault: true
    # --- path 1: backend ---
    basicAuth: true
    basicAuthUser: root
    jsonData:
      url: http://vla-tdengine:6041
    secureJsonData:
      # env interpolation; real values come from .env (not in git)
      basicAuthPassword: ${TD_PASS}
      # --- path 2: frontend proxy routes ---
      url: http://vla-tdengine:6041
      basicAuth: ${TD_BASIC_AUTH}   # base64("root:<TD_PASS>")
    editable: true

  # ---------------------------------------------------------------------- MES
  # batch-engine REST — orders, OEE, verdicts, inventory, equipment health.
  # None of that lives in the historian; it is MongoDB behind the FastAPI.
  # Reachable because grafana and vla-batch-engine share idp-network, and the
  # engine REST is internal-only so it carries no auth of its own.
  - name: Batch Engine
    type: marcusolsson-json-datasource
    uid: vla-batch-engine        # LOCK — dashboards reference this uid
    orgId: 1
    access: proxy
    url: http://vla-batch-engine:8000/api/v1
    isDefault: false
    editable: true
